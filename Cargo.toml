[workspace]
resolver = "2"
members = [
    "crates/host",
    "crates/cli",
    "crates/protocol-rs",
    "apps/desktop/src-tauri",
    "crates/process-supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
fs2 = "0.4"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
# Local-IPC serving (named pipe / Unix socket) reuses hyper's HTTP/1 server
# over arbitrary tokio streams; the desktop bridge uses the client side.
hyper-util = { version = "0.1", default-features = false, features = [
    "server-auto",
    "service",
    "tokio",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-single-instance = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
