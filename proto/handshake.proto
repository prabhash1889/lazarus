syntax = "proto3";

package lazarus.protocol.v1;

import "common.proto";

// Negotiation rules (plan sections 9.2/9.4):
// - major versions must match exactly; any other combination is rejected
//   with ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION;
// - negotiated_minor = min(client.minor, host.minor), so an older minor
//   client interoperates with a newer minor host and vice versa;
// - capabilities are AND-combined: a capability is considered enabled only
//   when both sides advertise it.

enum AuthKind {
  AUTH_KIND_UNSPECIFIED = 0;
  AUTH_KIND_LOCAL_TOKEN = 1;
}

message Auth {
  AuthKind kind = 1;
  string token = 2;
}

// First frame a client sends on connect; the host replies with HostReply.
message ClientHello {
  string client = 1;
  string client_version = 2;
  ProtocolVersion protocol = 3;
  repeated string supported_features = 4;
  Auth auth = 5;
}

message HostReply {
  string host_version = 1;
  ProtocolVersion protocol = 2;
  // Highest minor both sides support within the request's major version.
  int32 negotiated_minor = 3;
  map<string, bool> capabilities = 4;
}
