syntax = "proto3";

package lazarus.protocol.v1;

import "google/protobuf/timestamp.proto";

// Idempotency keys for write RPCs travel in gRPC metadata under the
// "x-lazarus-idempotency-key" header (see proto/README.md). They are
// deliberately not message fields so every future write RPC inherits the
// convention additively without schema churn.

// Semantic version of the wire protocol exchanged during handshake.
message ProtocolVersion {
  int32 major = 1;
  int32 minor = 2;
}

// Frame header and payload for every message crossing a transport boundary.
message Envelope {
  string message_id = 1;
  optional string correlation_id = 2;
  optional string stream_id = 3;
  optional uint64 sequence = 4;
  google.protobuf.Timestamp timestamp = 5;
  string payload_type = 6;
  bytes payload = 7;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_CANCELLED = 1;
  ERROR_CODE_UNKNOWN = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_ALREADY_EXISTS = 6;
  ERROR_CODE_PERMISSION_DENIED = 7;
  ERROR_CODE_UNAUTHENTICATED = 8;
  ERROR_CODE_FAILED_PRECONDITION = 9;
  ERROR_CODE_UNAVAILABLE = 10;
  // Replay of a dropped stream is impossible; the client must re-subscribe.
  ERROR_CODE_STREAM_GAP = 11;
  ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION = 12;
  ERROR_CODE_IDEMPOTENCY_CONFLICT = 13;
  ERROR_CODE_INTERNAL = 14;
}

message ErrorDetail {
  string type_url = 1;
  bytes value = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

message PaginationRequest {
  uint32 page_size = 1;
  optional string page_token = 2;
}

message PaginationResponse {
  optional string next_page_token = 1;
}

// Grants resume of an event stream from an acknowledged sequence.
message ReconnectToken {
  string token = 1;
  string stream_id = 2;
  uint64 last_sequence = 3;
  google.protobuf.Timestamp expires_at = 4;
}
