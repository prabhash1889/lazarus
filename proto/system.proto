syntax = "proto3";

package lazarus.protocol.v1;

import "common.proto";
import "handshake.proto";

message GetInfoRequest {}

message GetInfoResponse {
  string host_version = 1;
  ProtocolVersion protocol = 2;
  map<string, bool> capabilities = 3;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
}

message HealthRequest {}

message HealthResponse {
  ServingStatus status = 1;
}

message SubscribeEventsRequest {
  optional ReconnectToken reconnect = 1;
}

service SystemService {
  // Explicit version/capability negotiation (plan section 9.2). Clients
  // SHOULD call this first after connecting; hosts reject incompatible
  // majors with ERROR_CODE_UNSUPPORTED_PROTOCOL_VERSION.
  rpc Negotiate(ClientHello) returns (HostReply);
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Server stream of Envelope frames. Cancellation is transport-level: a
  // client cancels by cancelling/dropping the RPC itself, so no explicit
  // cancel RPC exists. On disconnect, resume from the last acknowledged
  // sequence by passing a ReconnectToken; the host answers with
  // ERROR_CODE_STREAM_GAP when replay is impossible.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Envelope);
}
