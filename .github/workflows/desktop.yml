name: Desktop debug packages

on:
  push:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build debug bundle
        working-directory: apps/desktop
        run: pnpm exec tauri build --debug --target ${{ matrix.target }}
      - name: Upload debug package
        uses: actions/upload-artifact@v4
        with:
          name: lazarus-desktop-debug-${{ matrix.os }}
          # Tauri v2 detects the parent Cargo workspace and writes bundles to
          # the workspace-root target directory, not src-tauri/target.
          path: target/${{ matrix.target }}/debug/bundle/
          if-no-files-found: error
