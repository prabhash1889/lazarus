[package]
name = "lazarus-hostd"
description = "Lazarus local Host daemon: the source of truth for tasks, agents, and artifacts."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
# Stream trait for the SSE subscription (already in the tree via axum).
futures-core = "0.3"
fs2.workspace = true
hyper.workspace = true
# Serves the authenticated surface over named pipes / Unix sockets by
# driving hyper's HTTP/1 server over the accepted local streams.
hyper-util.workspace = true
protocol-rs = { path = "../protocol-rs" }
process-supervisor = { path = "../process-supervisor" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# BroadcastStream adapter so the SSE feed reads the event bus's broadcast
# channel directly with correct persistent waker state.
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
