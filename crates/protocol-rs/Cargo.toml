[package]
name = "protocol-rs"
description = "Rust bindings for the Lazarus Protocol: generated contract registry plus transport-neutral auth, idempotency, and manifest negotiation contracts."
version.workspace = true
license.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Derives for the generated wire types (serde_json alone is not enough).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
