[package]
name = "protocol-rs"
description = "Rust bindings for the Lazarus Protocol: generated prost/tonic types plus envelope, handshake, error, and pagination skeletons."
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Edition 2021 (not the workspace default 2024): the build script must point
# PROTOC at the vendored binary and std::env::set_var is only safe-callable
# pre-2024.
edition = "2021"

[dependencies]
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored.workspace = true
prost-build.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true
